name: Deploy to Hostinger VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Production VPS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH to Hostinger VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST || '89.116.33.188' }}
          username: ${{ secrets.VPS_USERNAME || 'root' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            set -e
            echo "==> Starting deployment on Hostinger VPS..."
            
            TARGET_DIR="/var/www/bebrilliant"
            
            if [ ! -d "$TARGET_DIR" ]; then
              echo "==> Creating target directory $TARGET_DIR..."
              mkdir -p "$TARGET_DIR"
              git clone https://github.com/contactharisolutions-pixel/bebrilliant.git "$TARGET_DIR"
            fi

            cd "$TARGET_DIR"

            echo "==> Fetching latest changes from git origin/main..."
            git fetch origin main
            git reset --hard origin/main

            echo "==> Loading Node.js environment..."
            export NVM_DIR="$HOME/.nvm"
            if [ -s "$NVM_DIR/nvm.sh" ]; then
              \. "$NVM_DIR/nvm.sh"
            fi
            
            nvm use 20 || nvm install 20

            echo "==> Installing dependencies..."
            npm install

            echo "==> Building Next.js application..."
            npm run build

            echo "==> Reloading PM2 processes (Zero-downtime)..."
            pm2 reload ecosystem.config.js --update-env || pm2 start ecosystem.config.js

            echo "==> Reloading Nginx configuration..."
            nginx -t && systemctl reload nginx

            echo "==> Deployment completed successfully!"
